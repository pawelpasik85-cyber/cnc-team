# Testy + aplikacja pracownika (strona i APK) przy każdej zmianie w main.
# Wynik: gałąź web-dist w tym repozytorium (strona + CNC-Team.apk) i wydanie (Releases).
# Jeśli istnieje sekret APP_DEPLOY_TOKEN (token z prawem zapisu do cnc-team-app),
# ta sama zawartość trafia automatycznie do publicznego repozytorium cnc-team-app → GitHub Pages.
name: Testy i aplikacja pracownika

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Testy (CNC Team + aplikacja pracownika)
        run: npm test

  apk:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Budowa strony aplikacji pracownika
        run: BUILD_ID="1.${{ github.run_number }}" node scripts/build-mobile.js dist-mobile

      - name: Zależności powłoki Android
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Projekt Android
        working-directory: android-app
        run: |
          set -o pipefail
          rm -rf www && cp -r ../dist-mobile www
          npx cap add android 2>&1 | tee cap-add.log || { echo "::error title=cap add::$(tail -c 3000 cap-add.log | tr '\n' ' ')"; exit 1; }

      - name: Ikona i ekran startowy
        continue-on-error: true
        working-directory: android-app
        run: |
          npm rebuild sharp --foreground-scripts > sharp.log 2>&1 || tail -20 sharp.log
          npx capacitor-assets generate --android --iconBackgroundColor '#23282d' --splashBackgroundColor '#23282d' --splashBackgroundColorDark '#23282d'

      - name: Synchronizacja i wersja
        working-directory: android-app
        run: |
          npx cap sync android
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Budowa APK
        working-directory: android-app/android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log || { echo "::error title=gradle::$(grep -E 'error|FAILURE|What went wrong' -A3 gradle.log | tail -c 3000 | tr '\n' ' ')"; exit 1; }

      - name: Podpis stałym kluczem projektu
        # Zawsze ten sam klucz — nowa wersja instaluje się na starą i dane zostają.
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" sign --ks android-signing/cnc-team.keystore --ks-pass pass:cnc-team-sideload \
            --ks-key-alias cnc-team --key-pass pass:cnc-team-sideload \
            --out CNC-Team.apk android-app/android/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify CNC-Team.apk
          cp CNC-Team.apk dist-mobile/CNC-Team.apk

      - name: Gałąź web-dist (strona + APK)
        run: |
          cp -r dist-mobile "$RUNNER_TEMP/web"
          cd "$RUNNER_TEMP/web"
          git init -q -b web-dist
          git config user.name "cnc-team-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Aplikacja pracownika ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web-dist

      - name: Publikacja w cnc-team-app (GitHub Pages)
        env:
          APP_DEPLOY_TOKEN: ${{ secrets.APP_DEPLOY_TOKEN }}
        run: |
          if [ -z "$APP_DEPLOY_TOKEN" ]; then
            echo "::notice::Brak sekretu APP_DEPLOY_TOKEN — strona nie została automatycznie opublikowana w cnc-team-app (gałąź web-dist jest gotowa)."
            exit 0
          fi
          cd "$RUNNER_TEMP/web"
          git push -q -f "https://x-access-token:${APP_DEPLOY_TOKEN}@github.com/${{ github.repository_owner }}/cnc-team-app.git" web-dist:main

      - name: Wydanie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CNC Team — aplikacja pracownika 1.${{ github.run_number }}
          body: "APK z commita ${{ github.sha }}. Instalacja: pobierz CNC-Team.apk na telefonie i zainstaluj (zastępuje poprzednią wersję)."
          files: CNC-Team.apk
          make_latest: true
