name: Recenzja GPT

# Każdy push trafia do GPT do niezależnej recenzji (komentarz pod commitem).
# Brak sekretu OPENAI_API_KEY = recenzja pominięta, reszta działa normalnie.
on:
  push:
    branches-ignore: [web-dist]

permissions:
  contents: write

concurrency:
  group: recenzja-gpt-${{ github.sha }}
  cancel-in-progress: true

jobs:
  recenzja:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - name: Testy recenzenta
        run: python3 -m unittest discover -s .github/gpt-recenzent -p 'test_*.py'
      - name: Recenzja GPT
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          ZASADY_GLOBALNE: .github/gpt-recenzent/ZASADY.md
        run: python3 .github/gpt-recenzent/recenzja.py
