# Przykład: reverse proxy nginx z HTTPS przed CNC Team (aplikacja nasłuchuje na 127.0.0.1:3000).
server {
  listen 443 ssl http2;
  server_name cnc-team.firma.pl;
  ssl_certificate     /etc/ssl/firma/cnc-team.crt;
  ssl_certificate_key /etc/ssl/firma/cnc-team.key;
  client_max_body_size 6m;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }
}
server { listen 80; server_name cnc-team.firma.pl; return 301 https://$host$request_uri; }
